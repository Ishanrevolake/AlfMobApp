org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=4
android.useAndroidX=true
android.enableJetifier=true
# Kotlin's incremental cache cannot relativize plugin sources from the Pub cache
# on C: against this project's build directory on F: under Windows.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
